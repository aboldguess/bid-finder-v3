# TEMPORARY: runs scripts/probe.js on pushes to this branch and commits what
# the portals returned to probe-out/. Removed before merge.
name: probe
on:
  push:
    branches: [claude/project-thread-m0d3sy]
    paths: [scripts/probe.js, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/probe.js
      - name: Commit the responses
        run: |
          git config user.name probe-bot
          git config user.email probe-bot@users.noreply.github.com
          git add -f probe-out
          git commit -m "Probe responses [skip ci]" && git push
