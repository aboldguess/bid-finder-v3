# Checks every built-in source against the live portal: weekly, on demand,
# and whenever a connector changes. A failure here means a portal changed its
# API or pages, not that the app is broken.
name: live sources
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/connectors/**'
      - 'src/http/**'
      - 'scripts/check-sources.js'
      - '.github/workflows/live-sources.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch one page from each source
        run: node scripts/check-sources.js
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          LOG_LEVEL: debug
      - name: Diagnose (temporary)
        if: always()
        run: |
          set +e
          echo "=== IFS robots"; curl -sSIL -m 20 -A 'BidFinder/4.0.0' https://apply-for-innovation-funding.service.gov.uk/robots.txt | grep -iE '^(HTTP|location)'
          curl -sSL -m 20 -A 'BidFinder/4.0.0' https://apply-for-innovation-funding.service.gov.uk/robots.txt | head -c 1500
          echo; echo "=== IFS search headers"; curl -sSI -m 20 https://apply-for-innovation-funding.service.gov.uk/competition/search | grep -iE '^(HTTP|x-robots)'
