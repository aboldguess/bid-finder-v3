# Checks every built-in source against the live portal: weekly, on demand,
# and whenever a connector changes. A failure here means a portal changed its
# API or pages, not that the app is broken.
name: live sources
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/connectors/**'
      - 'src/http/**'
      - 'scripts/check-sources.js'
      - '.github/workflows/live-sources.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch one page from each source
        run: node scripts/check-sources.js
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          LOG_LEVEL: debug
      - name: Diagnose (temporary)
        if: always()
        run: |
          set +e
          echo "=== PCS chain"; echo | openssl s_client -connect api.publiccontractsscotland.gov.uk:443 -servername api.publiccontractsscotland.gov.uk -showcerts 2>/dev/null | grep -E '^ *[0-9] s:|^ *i:'
          echo | openssl s_client -connect api.publiccontractsscotland.gov.uk:443 -servername api.publiccontractsscotland.gov.uk 2>/dev/null | openssl x509 -noout -ext authorityInfoAccess
          for u in "https://api.publiccontractsscotland.gov.uk/v1/Notices?dateFrom=10-2026&noticeType=2&outputType=0" \
                   "https://api.sell2wales.gov.wales/v1/Notices" \
                   "https://api.sell2wales.gov.wales/v1/Notices?dateFrom=10-2026&noticeType=2&outputType=1" \
                   "https://api.sell2wales.gov.wales/v1/Notices?dateFrom=10-2026&noticeType=102&outputType=0" \
                   "https://api.sell2wales.gov.wales/v1/Notices?dateFrom=10-2026&outputType=0" \
                   "https://api.sell2wales.gov.wales/v1/Notices?dateFrom=01-10-2026&noticeType=2&outputType=0" \
                   "https://api.sell2wales.gov.wales/v1/Notices?dateFrom=10-2025&noticeType=2&outputType=0" \
                   "https://api.sell2wales.gov.wales/" ; do
            echo "=== $u"; curl -ksS -m 40 -o /tmp/b -w '%{http_code} %{content_type}\n' "$u"; head -c 300 /tmp/b | tr '\n' ' '; echo
          done
          echo "=== IFS robots"; curl -sS -m 20 -o /tmp/r -w '%{http_code}\n' -A 'BidFinder/4.0.0' https://apply-for-innovation-funding.service.gov.uk/robots.txt; head -c 800 /tmp/r
          curl -sS -m 20 -o /tmp/r -w '%{http_code}\n' https://apply-for-innovation-funding.service.gov.uk/robots.txt; head -c 800 /tmp/r
          echo "=== IFS search"; curl -sS -m 20 -o /dev/null -w '%{http_code}\n' https://apply-for-innovation-funding.service.gov.uk/competition/search
