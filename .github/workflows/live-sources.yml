# Checks every built-in source against the live portal: weekly, on demand,
# and whenever a connector changes. A failure here means a portal changed its
# API or pages, not that the app is broken.
name: live sources
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/connectors/**'
      - 'src/http/**'
      - 'scripts/check-sources.js'
      - '.github/workflows/live-sources.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch one page from each source
        run: node scripts/check-sources.js
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          LOG_LEVEL: debug
      - name: Diagnose (temporary)
        if: always()
        run: |
          node -e "
          let u='https://apply-for-innovation-funding.service.gov.uk/robots.txt';
          (async()=>{for(let i=0;i<6;i++){const r=await fetch(u,{redirect:'manual',headers:{'User-Agent':'BidFinder/4.0.0'}});const t=await r.text();console.log(r.status,r.headers.get('content-type'),u.slice(0,120));if(r.status>=300&&r.status<400){u=new URL(r.headers.get('location'),u).href;continue}console.log(t.slice(0,400));break}
          const r=await fetch('https://apply-for-innovation-funding.service.gov.uk/robots.txt',{headers:{'User-Agent':'BidFinder/4.0.0'}});console.log('followed:',r.status,r.url.slice(0,100));})()"
